name: Portable training entry points

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]' wheel
      - name: Preview and metadata tests (no physics or training)
        run: >-
          python -m pytest -q
          tests/test_config.py
          tests/test_cooperation_flags.py
          tests/test_cooperative_config.py
          tests/test_run_trained.py
          tests/test_public_training_preset.py
      - name: Build distributable with robot assets
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
