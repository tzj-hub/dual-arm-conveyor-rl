[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-arm-conveyor"
version = "0.8.6"
description = "Hierarchical four-arm conveyor sorting with a learned PPO scheduler and physical finger control"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY.md", "src/dual_arm_conveyor/assets/robots/panda/LICENSE", "src/dual_arm_conveyor/assets/robots/panda/NOTICE", "src/dual_arm_conveyor/assets/licenses/MUJOCO_LICENSE"]
requires-python = ">=3.10"
keywords = ["robotics", "reinforcement-learning", "mujoco", "conveyor-sorting"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "mujoco>=3.11,<4"]

[project.optional-dependencies]
train = ["torch>=2.2", "matplotlib>=3.8"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4.9", "Pillow>=10"]
test = ["pytest>=8"]
all = ["torch>=2.2", "matplotlib>=3.8", "imageio>=2.31", "imageio-ffmpeg>=0.4.9", "Pillow>=10", "pytest>=8"]

[project.scripts]
conveyor = "dual_arm_conveyor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dual_arm_conveyor = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
